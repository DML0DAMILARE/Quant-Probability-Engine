services:
  - type: web
    name: oqpe-terminal
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn oqpe_dashboard_v9:server --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0